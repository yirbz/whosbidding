services:
  # --- WhosBidding Application ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whosbidding-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-http://rest:3000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE2NDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTY0MDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.placeholder-service-key}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-pdl_sandbox_test}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-pdl_ntfset_test}
      NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-test_client_token}
      NEXT_PUBLIC_PADDLE_ENVIRONMENT: ${NEXT_PUBLIC_PADDLE_ENVIRONMENT:-sandbox}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      redis:
        condition: service_healthy

  # --- Redis Cache Service ---
  redis:
    image: redis:alpine
    container_name: whosbidding-redis
    ports:
      - "${REDIS_PORT:-63799}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Self-Hosted Supabase PostgreSQL Database ---
  db:
    image: supabase/postgres:15.1.1.78
    container_name: whosbidding-db
    ports:
      - "${DB_PORT:-54332}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- PostgREST API (Direct REST Engine for @supabase/supabase-js on port 54321) ---
  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: whosbidding-rest
    ports:
      - "${REST_PORT:-54321}:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres?sslmode=disable
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Supabase Studio Management Dashboard ---
  studio:
    image: supabase/studio:latest
    container_name: whosbidding-studio
    ports:
      - "${STUDIO_PORT:-54333}:3000"
    environment:
      STUDIO_PG_META_URL: http://db:5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SUPABASE_URL: http://web:3000
      SUPABASE_PUBLIC_URL: http://localhost:54321
    restart: unless-stopped

volumes:
  db-data:
